name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      # Publish to a rolling GitHub Release instead of an Actions artifact:
      # release assets don't count against the (small) artifact storage quota,
      # give a stable download URL and don't expire.
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          TAG="latest"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Latest debug APK" \
              --notes "Автосборка последнего коммита ветки. Файл app-debug.apk ниже." \
              --prerelease
          gh release upload "$TAG" "$APK" --clobber

      # Best-effort artifact upload too; ignored if the artifact quota is full.
      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
